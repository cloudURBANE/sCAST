# Beam — excerpt to MERGE into ~/.hermes/config.yaml (not a standalone file).
# Targets Hermes Agent v0.17.0 (v2026.6.19, "The Reach Release"). Verify keys
# against your installed Hermes: `hermes --version`, `hermes doctor`, `hermes model`.

# --- Reasoning model: route through OpenRouter ------------------------------
# Beam reasons through OpenRouter (matches the production in-process loop, which
# uses OPENROUTER_API_KEY). OpenRouter slugs are "<vendor>/<model>", addressed
# through the openrouter provider. Confirm the exact alias your Hermes build
# expects with `hermes model` (some builds want "openrouter/<vendor>/<model>").
provider: openrouter
model: "anthropic/claude-opus-4.8"        # strong tier for synthesis/collections
# model: "anthropic/claude-haiku-4.5"     # cheaper tier for routing/chat
# You are not limited to Claude here — any tool-calling OpenRouter model works.

# --- Beam MCP tool server (HTTP, private/localhost) -------------------------
mcp_servers:
  beam:
    # Env-driven so the same profile works locally and on Railway. Set in
    # ~/.hermes/.env (dev: http://127.0.0.1:8848/mcp) or Railway env
    # (prod: http://api-server.railway.internal:8848/mcp — always http on the
    # private network; TLS is unnecessary there and will fail).
    url: "${BEAM_MCP_URL}"
    headers:
      # Resolved at connect time from ~/.hermes/.env (see dot-hermes-env.example).
      Authorization: "Bearer ${BEAM_AGENT_TOKEN_V2}"
    tools:
      # Expose ONLY the Beam read tools. No write/terminal/browser tools here.
      include:
        - beam_get_user_context
        - beam_get_wardrobe
        - beam_search_catalog
        - beam_get_fragrance_details
        - beam_score_candidates
        # Redundancy radar: does a candidate overlap with what the user already
        # owns? Deterministic note/accord comparison against the vault.
        - beam_compare_overlap
        # Cost-capped live web research (freshness-gated, cached). The server
        # always advertises this tool, but it stays INERT — every call returns a
        # `note` saying live research is unavailable — until BEAM_RESEARCH_ENABLED
        # + OPENROUTER_API_KEY are set in the MCP server's env (see
        # dot-hermes-env.example). Safe to list either way.
        - beam_research_web
        # Presentation/proposal tools resolve grounded catalog and vault data into
        # app-renderable cards or add-ready proposals. They do not write to the
        # user's vault; the app Confirm remains the only write path.
        - beam_propose_collection
        - beam_show_scent_profile
        - beam_compare_fragrances
        - beam_present_travel_kit
      prompts: false
      resources: false
    timeout: 60
    connect_timeout: 15
    # Read-only tools are safe to run concurrently:
    supports_parallel_tool_calls: true

# Also strip Hermes' powerful built-in tools from the consumer Beam profile
# (terminal, browser, file write, etc.) with `hermes tools` — see the runbook §6.
