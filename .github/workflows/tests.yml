name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the migration guard can diff against the PR base.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      # v6: automatic package-manager detection was narrowed to npm, but an
      # explicit `cache: pnpm` input is still honored (restoreCache is called
      # with the input value directly). pnpm/action-setup above runs first so
      # the pnpm store path resolves before this step.
      - uses: actions/setup-node@v6
        with:
          # Match the Dockerfile (node:22-bookworm-slim) and engines (>=22.6).
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run test

      - run: pnpm --filter @workspace/scent-cast run build

      - run: pnpm --filter @workspace/scent-cast run perf:lhci

      # A schema change must ship with a migration file (E1). Only meaningful on
      # PRs, where a base ref exists to diff against.
      - name: Require migration for schema changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-migration-present.mjs "origin/${{ github.base_ref }}"

      # Blocking (readiness gap S7): findings were triaged 2026-07-09 and every
      # high resolved via the security-floor pnpm.overrides in package.json.
      # When this fails on a NEW advisory, either bump the affected parent dep
      # or add a same-major floor to pnpm.overrides — never re-add `|| true`.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

  # Catches Dockerfile/lockfile breakage at PR time instead of at Railway
  # deploy time. Only runs when the image inputs actually changed.
  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Check whether image inputs changed
        id: changed
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          if git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD \
            | grep -qE '^(Dockerfile|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|artifacts/.*/package\.json|lib/.*/package\.json|scripts/package\.json)$'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.docker == 'true'

      - name: Build image (no push)
        if: steps.changed.outputs.docker == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
