name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          # Match the Dockerfile runtime (node:22-bookworm-slim) and the
          # engines field — CI must test the Node prod actually runs.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run test

      # Report-only for now: surface known-vulnerable prod deps without
      # blocking merges. Flip to a hard failure (drop `|| true`) once the
      # initial findings are triaged.
      - name: Audit production dependencies (report-only)
        run: pnpm audit --prod --audit-level=high || true

      # A schema change that reaches prod must ride a reviewed SQL migration,
      # never a bare `drizzle-kit push` (production-readiness E1). Fail the PR
      # when lib/db/src/schema/** changed but no migration file did.
      - name: Require a migration alongside schema changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          CHANGED=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD)
          if echo "$CHANGED" | grep -q '^lib/db/src/schema/' \
            && ! echo "$CHANGED" | grep -q '^lib/db/migrations/'; then
            echo "::error::lib/db/src/schema/** changed without a lib/db/migrations/ file."
            echo "Generate one with: pnpm --filter @workspace/db run generate"
            exit 1
          fi

      - run: pnpm --filter @workspace/scent-cast run build

      - run: pnpm --filter @workspace/scent-cast run perf:lhci

  # Catches Dockerfile/lockfile breakage at PR time instead of at Railway
  # deploy time. Only runs when the image inputs actually changed.
  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Check whether image inputs changed
        id: changed
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          if git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD \
            | grep -qE '^(Dockerfile|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|artifacts/.*/package\.json|lib/.*/package\.json|scripts/package\.json)$'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.docker == 'true'

      - name: Build image (no push)
        if: steps.changed.outputs.docker == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
