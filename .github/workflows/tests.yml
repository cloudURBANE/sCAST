name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the migration guard can diff against the PR base.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      # v6: automatic package-manager detection was narrowed to npm, but an
      # explicit `cache: pnpm` input is still honored (restoreCache is called
      # with the input value directly). pnpm/action-setup above runs first so
      # the pnpm store path resolves before this step.
      - uses: actions/setup-node@v6
        with:
          # Match the Dockerfile (node:22-bookworm-slim) and engines (>=22.6).
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run test

      - run: pnpm --filter @workspace/scent-cast run build

      - run: pnpm --filter @workspace/scent-cast run perf:lhci

      # A schema change must ship with a migration file (E1). Only meaningful on
      # PRs, where a base ref exists to diff against.
      - name: Require migration for schema changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-migration-present.mjs "origin/${{ github.base_ref }}"

      # Blocking (readiness gap S7): findings were triaged 2026-07-09 and every
      # high resolved via the security-floor pnpm.overrides in package.json.
      # When this fails on a NEW advisory, either bump the affected parent dep
      # or add a same-major floor to pnpm.overrides — never re-add `|| true`.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
