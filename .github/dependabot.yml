version: 2
updates:
  # npm/pnpm dependencies. Grouped so routine minor/patch bumps arrive as a few
  # PRs, not dozens. Note: pnpm's minimumReleaseAge (1440m) in pnpm-workspace.yaml
  # delays fresh versions ~1 day — Dependabot PRs may sit briefly until the age
  # gate passes; that's expected and complementary, not a conflict.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions pinned versions current (security patches to the CI
  # supply chain).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch
