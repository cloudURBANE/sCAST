<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No `maximum-scale`/`user-scalable=no`: blocking pinch-zoom fails WCAG
         1.4.4 (Resize Text) and iOS Safari ignores it anyway for accessibility.
         `viewport-fit=cover` is retained for the edge-to-edge safe-area layout. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      No-flash theme/accent/language bootstrap. Runs before first paint so the
      saved preferences are applied to <html> with no flicker. Defaults match the
      historical look exactly (dark + gold), so a first-time or storage-blocked
      visitor sees the signature theme. The React providers (ThemeProvider /
      I18nProvider) read the same localStorage keys and stay in sync from here.
    -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var theme = localStorage.getItem('scent_theme') === 'light' ? 'light' : 'dark';
          var accent = localStorage.getItem('scent_accent') === 'green' ? 'green' : 'gold';
          var locale = localStorage.getItem('scent_locale');
          d.setAttribute('data-theme', theme);
          d.setAttribute('data-accent', accent);
          d.style.colorScheme = theme;
          if (locale && /^(en|es|fr|de)$/.test(locale)) d.setAttribute('lang', locale);
        } catch (e) {}
      })();
    </script>
    <title>ScentBeam</title>
    <meta name="description" content="Your scent. Perfected." />
    <!--
      Standalone / full-screen behavior.

      In a normal in-browser tab the OS owns the address bar and bottom
      toolbar; a web page cannot force those away (mobile Safari only
      auto-collapses them on scroll). The reliable way to drop that chrome
      is to run as an installed web app, so we declare full-screen web-app
      capability here. Combined with `display: standalone` in
      site.webmanifest this gives:
        - iOS Safari ("Add to Home Screen"): launches chrome-free.
        - Android Chrome (manifest): installed PWA launches standalone.
      `black-translucent` lets our black UI extend under the status bar
      (paired with `viewport-fit=cover` + safe-area insets already used in
      the layout) for an edge-to-edge canvas.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ScentBeam" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Processed bottle packshots are served DIRECT (cross-origin) from Firebase
      Storage (see imageObjectStorage.ts) — they bypass /api/image-proxy. Warm the
      DNS+TCP+TLS connection up front so the first/LCP bottle image starts sooner
      on cold visits. No `crossorigin`: <img> packshots are no-cors requests, so
      the hint must match their connection to be reused (a crossorigin hint would
      open a separate, unused connection). dns-prefetch is the harmless fallback
      for engines that don't act on preconnect.
    -->
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
    <!--
      Load Google Fonts NON-BLOCKING. A plain `rel="stylesheet"` here is
      render-blocking: first paint waits on this cross-origin CSS. The
      `media="print"` trick lets the browser fetch the sheet at low priority
      without blocking render, then `onload` swaps it to `media="all"` so the
      fonts apply once available (`display=swap` already prevents invisible
      text in the interim). The <noscript> fallback restores a normal blocking
      stylesheet when JavaScript is unavailable. Same families/weights as
      before — this is a load-strategy change only, not a font-stack change.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Pinyon+Script&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Pinyon+Script&display=swap" rel="stylesheet">
    </noscript>
