<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No `maximum-scale`/`user-scalable=no`: blocking pinch-zoom fails WCAG
         1.4.4 (Resize Text) and iOS Safari ignores it anyway for accessibility.
         `viewport-fit=cover` is retained for the edge-to-edge safe-area layout. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ScentBeam</title>
    <meta name="description" content="Your scent. Perfected." />
    <!--
      Standalone / full-screen behavior.

      In a normal in-browser tab the OS owns the address bar and bottom
      toolbar; a web page cannot force those away (mobile Safari only
      auto-collapses them on scroll). The reliable way to drop that chrome
      is to run as an installed web app, so we declare full-screen web-app
      capability here. Combined with `display: standalone` in
      site.webmanifest this gives:
        - iOS Safari ("Add to Home Screen"): launches chrome-free.
        - Android Chrome (manifest): installed PWA launches standalone.
      `black-translucent` lets our black UI extend under the status bar
      (paired with `viewport-fit=cover` + safe-area insets already used in
      the layout) for an edge-to-edge canvas.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ScentBeam" />
    <link rel="canonical" href="https://scentbeam.com/" />
    <meta property="og:site_name" content="ScentBeam" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scentbeam.com/" />
    <meta property="og:title" content="ScentBeam" />
    <meta property="og:description" content="Your scent. Perfected." />
    <meta property="og:image" content="https://scentbeam.com/opengraph-scentbeam-v2.png" />
    <meta property="og:image:secure_url" content="https://scentbeam.com/opengraph-scentbeam-v2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1731" />
    <meta property="og:image:height" content="909" />
    <meta property="og:image:alt" content="ScentBeam - Your scent. Perfected." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ScentBeam" />
    <meta name="twitter:description" content="Your scent. Perfected." />
    <meta name="twitter:image" content="https://scentbeam.com/opengraph-scentbeam-v2.png" />
    <meta name="twitter:image:alt" content="ScentBeam - Your scent. Perfected." />
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-TileImage" content="/icons/app-icon-black/mstile-150x150-ish.png" />
    <link rel="icon" href="/icons/transparent-emblem/favicon.ico" sizes="any" />
    <link rel="icon" href="/icons/transparent-emblem/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/icons/transparent-emblem/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/app-icon-black/apple-touch-icon.png" />
    <link rel="preload" href="/icons/transparent-emblem/scentbeam-emblem-192x192.png" as="image" fetchpriority="high" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Processed bottle packshots are served DIRECT (cross-origin) from Firebase
      Storage (see imageObjectStorage.ts) — they bypass /api/image-proxy. Warm the
      DNS+TCP+TLS connection up front so the first/LCP bottle image starts sooner
      on cold visits. No `crossorigin`: <img> packshots are no-cors requests, so
      the hint must match their connection to be reused (a crossorigin hint would
      open a separate, unused connection). dns-prefetch is the harmless fallback
      for engines that don't act on preconnect.
    -->
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Pinyon+Script&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
